# アクティビスト(物言う株主)の一覧。大量保有報告書の「提出者名」で判定する。
# 判定のしかた: 提出者名と name・aliases をどちらも「全角半角をそろえ、空白・記号・株式会社などを除き、英字を大文字に」してから、
#   aliases のどれかが提出者名に含まれていればアクティビストとみなす(3文字以上の別名だけ使う)。
# 自由に追加・削除してかまいません。aliases には EDINET の提出者名の一部(カタカナ表記・英語表記)を書くと確実です。
#
# 出典(2026-11-05 に確認):
#   [A] 大手町プレップ「日本株アクティビストファンド一覧」 https://otemachiprep.com/activist-funds/
#   [B] アクティビストのことがわかるブログ「アクティビスト一覧(2025年11月版)」 https://note.com/activist_blog/n/nf25c21fb4cee
#       (大量保有報告書の保有目的に「重要提案行為等を行う場合がある」などと書いたことのある投資家の一覧)
#   [E] EDINET の大量保有報告書の提出者名(実データ)で表記を確認したもの

