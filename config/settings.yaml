# =============================================================
#  日本株 自動運用 設定
# =============================================================
data:
  start: "2010-01-01"          # 株価を取得する開始日
  # 対象の市場区分(JPXの銘柄一覧の「市場・商品区分」に含まれる文字)
  markets: ["プライム", "スタンダード", "グロース"]
  # 規模区分(TOPIXの構成区分)での絞り込み。空 [] なら絞り込まない
  #   TOPIX Core30 / TOPIX Large70 / TOPIX Mid400 = TOPIX500(大型・中型、流動性が高い)
  #   TOPIX Small 1 = 小型株のうち比較的大きい層 / TOPIX Small 2 = それ以外の小型株
  sizes: []                    # 研究では全銘柄を使う(今の大型株だけに絞ると、過去に成長した銘柄だけが残り成績が良く見える)
  chunk: 50                    # yfinance に一度に問い合わせる銘柄数
  sleep_sec: 2.0               # 問い合わせの間隔(Yahooへの負荷・制限対策)

# 爆ハネ期待値ランキング(scripts/21_daily_report.py)
report:
  top_n: 30                    # 表示する銘柄数
  budget_per_stock: 340000     # 1銘柄に使える金額の目安(円)。100株の金額がこれを超えると表示で知らせる
  stop_loss: -0.20             # 損切り目安(買値から -20%)。検証では最悪ケースを小さくする代わりに平均は少し下がる
  # レポートのコピー先(スマホで見る用)。OneDrive のフォルダにすると、スマホの OneDrive アプリで開ける。空 "" ならコピーしない
  publish_dir: "%USERPROFILE%\\OneDrive\\株ランキング"
